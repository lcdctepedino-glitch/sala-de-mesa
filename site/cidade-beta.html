<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="sm-versao" content="20261113d">
<link rel="icon" href="data:,">
<title>Desenhar cidade · Mundo de UDA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="js/base.css?v=20261113d">
<style>
/* Cidade desenhada à mão (BETA, 13/11/2026). Escolhe o pincel e risca; "Ver em 3D" abre cidade.html?desenho=1.
   O desenho fica só neste aparelho (localStorage "sm-cidade-beta"); ainda não vai para o banco. */
html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden;background:#000}
.cab{display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.cab input{flex:1;min-width:0;background:transparent;border:0;color:var(--titulo);font:600 19px var(--f-disp);padding:4px 0}
.beta{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--brasa);border:1px solid rgba(255,176,112,.4);border-radius:99px;padding:2px 8px}
.quadro{flex:1;min-height:0;display:grid;place-items:center;padding:10px;background:#0a0806}
canvas{touch-action:none;border-radius:10px;box-shadow:0 0 0 1px var(--line);max-width:100%;max-height:100%;aspect-ratio:1}
.dica{font-size:13px;color:var(--mute);text-align:center;padding:6px 14px 0;min-height:24px}
.tipos{display:flex;gap:6px;overflow-x:auto;padding:8px max(14px,env(safe-area-inset-left,0px)) 0}
.tipos button{all:unset;cursor:pointer;flex:none;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;color:var(--mute)}
.tipos button[aria-pressed=true]{background:var(--perg);color:#1a1510;border-color:var(--perg);font-weight:700}
.ferr{display:grid;grid-template-columns:repeat(5,1fr);padding:8px 4px 4px}
.ferr button{all:unset;cursor:pointer;display:grid;justify-items:center;gap:3px;padding:6px 2px;font-size:12px;color:var(--mute);border-radius:10px}
.ferr button[aria-pressed=true]{color:var(--perg);background:var(--card)}
.ferr i{width:22px;height:22px;border-radius:6px;display:block}
.acoes{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:8px;padding:6px max(14px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.acoes .bt{padding:11px 6px;font-size:14px}
button:focus-visible{outline:2px solid var(--brasa)}
@media (min-width:900px){body{flex-direction:row;flex-wrap:wrap}.cab{width:100%}.quadro{order:2}.painel{order:1;width:300px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-start;padding-top:14px}.ferr{grid-template-columns:1fr;gap:4px;padding:0 14px}.ferr button{grid-template-columns:22px 1fr;justify-items:start;align-items:center;gap:12px;padding:10px 12px;font-size:15px}.tipos{flex-wrap:wrap;padding:10px 14px}.acoes{grid-template-columns:1fr 1fr;padding:14px}.acoes .pri{grid-column:1/-1}.dica{text-align:left;padding:12px 14px}}
</style>
</head>
<body>
<div class="cab">
  <a class="lnk" href="index.html?aba=mundos">‹ Mundos</a>
  <input id="nome" maxlength="40" value="Minha cidade" aria-label="Nome da cidade">
  <span class="beta">beta</span>
</div>
<div class="painel">
  <div class="ferr" role="group" aria-label="Pincel">
    <button type="button" data-f="muralha" aria-pressed="true"><i style="border:3px solid #8a8170"></i>Muralha</button>
    <button type="button" data-f="rua" aria-pressed="false"><i style="background:linear-gradient(transparent 38%,#b9ad94 38% 62%,transparent 62%)"></i>Rua</button>
    <button type="button" data-f="agua" aria-pressed="false"><i style="background:linear-gradient(transparent 30%,#5f8fa8 30% 70%,transparent 70%)"></i>Água</button>
    <button type="button" data-f="predio" aria-pressed="false"><i style="background:#c05c35;border-radius:4px;transform:scale(.7)"></i>Prédio</button>
    <button type="button" data-f="apagar" aria-pressed="false"><i style="border:1.6px dashed var(--mute);border-radius:50%"></i>Apagar</button>
  </div>
  <div class="tipos" id="tipos" hidden role="group" aria-label="Tipo de prédio">
    <button type="button" data-t="casa" aria-pressed="true">Casa</button>
    <button type="button" data-t="taverna" aria-pressed="false">Taverna</button>
    <button type="button" data-t="templo" aria-pressed="false">Templo</button>
    <button type="button" data-t="torre" aria-pressed="false">Torre</button>
    <button type="button" data-t="praca" aria-pressed="false">Praça</button>
  </div>
  <p class="dica" id="dica"></p>
  <div class="acoes">
    <button class="bt sec" id="bt-desfazer" type="button">Desfazer</button>
    <button class="bt sec" id="bt-limpar" type="button">Limpar</button>
    <button class="bt pri" id="bt-3d" type="button">Ver em 3D</button>
  </div>
</div>
<div class="quadro"><canvas id="cv" width="900" height="900" aria-label="Planta da cidade: desenhe com o dedo ou o mouse"></canvas></div>

<script>
const $ = s => document.querySelector(s), cv = $("#cv"), x = cv.getContext("2d"), MEIA = 150, CHAVE = "sm-cidade-beta";
const DICAS = { muralha: "Risque em volta da cidade. A muralha fecha sozinha quando você solta.", rua: "Risque as ruas. Onde a rua cruza a muralha nasce um portão; sem rua, o portão fica ao sul.", agua: "Risque um rio. Para um lago, risque em volta e volte ao começo. Rua por cima da água vira ponte.", predio: "Escolha o tipo e toque onde ele fica. O resto da cidade ganha casas sozinho.", apagar: "Toque numa rua, rio ou prédio para apagar." };
let F = "muralha", TIPO = "casa", D = ler(), HIST = [], traco = null, LIMPAR = 0;
function ler() { try { const d = JSON.parse(localStorage.getItem(CHAVE)); if (d && typeof d === "object") return { nome: d.nome || "Minha cidade", muralha: d.muralha || null, ruas: d.ruas || [], agua: d.agua || [], predios: d.predios || [] } } catch (e) { } return exemplo() }
/* primeira vez: um exemplo pronto, para ver como funciona */
function exemplo() { return { nome: "Minha cidade", muralha: [[-70, -50], [0, -64], [70, -48], [82, 10], [55, 55], [-5, 62], [-62, 50], [-82, 5]], ruas: [[[0, 140], [0, 0], [-60, -20]], [[0, 0], [70, -10]]], agua: [[[-140, -110], [-100, -80], [-110, 40], [-140, 120]]], predios: [{ x: 0, z: -2, t: "praca" }, { x: -14, z: -30, t: "taverna" }, { x: 30, z: -35, t: "templo" }] } }
function gravar() { D.nome = $("#nome").value.trim() || "Minha cidade"; try { localStorage.setItem(CHAVE, JSON.stringify(D)) } catch (e) { } }
function guardarHist() { HIST.push(JSON.stringify(D)); if (HIST.length > 60) HIST.shift() }
$("#nome").value = D.nome; $("#nome").oninput = gravar;

/* metros ⇄ tela */
const k = () => cv.width / (2 * MEIA), aTela = p => [(p[0] + MEIA) * k(), (p[1] + MEIA) * k()];
function aMundo(e) { const r = cv.getBoundingClientRect(); return [Math.round(((e.clientX - r.left) / r.width * 2 - 1) * MEIA * 10) / 10, Math.round(((e.clientY - r.top) / r.height * 2 - 1) * MEIA * 10) / 10] }
/* risco à mão vira poucos pontos (Douglas-Peucker, 2,5 m) */
function simplificar(P, tol) { if (P.length < 3) return P; const a = P[0], b = P[P.length - 1]; let im = 0, dm = 0; for (let i = 1; i < P.length - 1; i++) { const d = dSeg(P[i], a, b); if (d > dm) { dm = d; im = i } } return dm > tol ? simplificar(P.slice(0, im + 1), tol).slice(0, -1).concat(simplificar(P.slice(im), tol)) : [a, b] }
function dSeg(p, a, b) { const dx = b[0] - a[0], dz = b[1] - a[1], L2 = dx * dx + dz * dz || 1, t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dz) / L2)); return Math.hypot(p[0] - a[0] - t * dx, p[1] - a[1] - t * dz) }
const lago = l => l.length >= 3 && Math.hypot(l[0][0] - l[l.length - 1][0], l[0][1] - l[l.length - 1][1]) < 15;   // risco de água que volta ao começo = lago (a cidade 3D usa a mesma regra)
const dLinha = (p, l) => { let d = 1e9; for (let i = 1; i < l.length; i++) d = Math.min(d, dSeg(p, l[i - 1], l[i])); return d };

function desenhar() {
  const K = k(); x.fillStyle = "#6e9148"; x.fillRect(0, 0, cv.width, cv.height);
  x.strokeStyle = "rgba(0,0,0,.08)"; x.lineWidth = 1; for (let m = -MEIA; m <= MEIA; m += 25) { const t = (m + MEIA) * K; x.beginPath(); x.moveTo(t, 0); x.lineTo(t, cv.height); x.moveTo(0, t); x.lineTo(cv.width, t); x.stroke() }
  const linha = (l, cor, larg, fechar) => { if (!l || l.length < 2) return; x.strokeStyle = cor; x.lineWidth = larg * K; x.lineCap = x.lineJoin = "round"; x.beginPath(); l.forEach((p, i) => { const [a, b] = aTela(p); i ? x.lineTo(a, b) : x.moveTo(a, b) }); if (fechar) x.closePath(); x.stroke() };
  D.agua.forEach(l => { if (lago(l)) { x.fillStyle = "#4f7f96"; x.beginPath(); l.forEach((p, i) => { const [a, b] = aTela(p); i ? x.lineTo(a, b) : x.moveTo(a, b) }); x.closePath(); x.fill() } else linha(l, "#4f7f96", 9) });
  if (D.muralha) { x.fillStyle = "rgba(230,216,181,.12)"; x.beginPath(); D.muralha.forEach((p, i) => { const [a, b] = aTela(p); i ? x.lineTo(a, b) : x.moveTo(a, b) }); x.closePath(); x.fill(); linha(D.muralha, "#7a7262", 4, true) }
  D.ruas.forEach(l => linha(l, "#b9ad94", 6));
  const COR = { casa: "#b5512f", taverna: "#a5492f", templo: "#8a3d28", torre: "#6e3424", praca: "#cfc3a6" }, TAM = { casa: 8, taverna: 12, templo: 13, torre: 6, praca: 22 }, NOME = { casa: "Casa", taverna: "Taverna", templo: "Templo", torre: "Torre", praca: "Praça" };
  D.predios.forEach(p => { const [a, b] = aTela([p.x, p.z]), s = TAM[p.t] * K; x.fillStyle = COR[p.t] || COR.casa; if (p.t === "praca") { x.beginPath(); x.arc(a, b, s / 2, 0, 6.29); x.fill() } else x.fillRect(a - s / 2, b - s / 2, s, s);
    x.font = "600 " + Math.round(13 * K / 3) + "px 'Atkinson Hyperlegible',sans-serif"; x.textAlign = "center"; x.lineWidth = 4; x.strokeStyle = "rgba(0,0,0,.6)"; x.strokeText(NOME[p.t], a, b - s / 2 - 5); x.fillStyle = "#f1ebe0"; x.fillText(NOME[p.t], a, b - s / 2 - 5) });
  if (traco) linha(traco.p, F === "agua" ? "#5f8fa8" : F === "rua" ? "#b9ad94" : "#7a7262", F === "agua" ? 9 : F === "rua" ? 6 : 4);
}

cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); const p = aMundo(e);
  if (F === "predio") { guardarHist(); D.predios.push({ x: p[0], z: p[1], t: TIPO }); gravar(); desenhar(); return }
  if (F === "apagar") { apagarPerto(p); return }
  traco = { id: e.pointerId, p: [p] }; desenhar() });
cv.addEventListener("pointermove", e => { if (!traco || e.pointerId !== traco.id) return; const p = aMundo(e), u = traco.p[traco.p.length - 1]; if (Math.hypot(p[0] - u[0], p[1] - u[1]) > 1.5) { traco.p.push(p); desenhar() } });
const soltar = e => { if (!traco || e.pointerId !== traco.id) return; let P = simplificar(traco.p, 2.5); traco = null;
  if (P.length >= 2 && Math.hypot(P[0][0] - P[P.length - 1][0], P[0][1] - P[P.length - 1][1]) + P.length > 4) { guardarHist();
    if (F === "muralha") { if (Math.hypot(P[0][0] - P[P.length - 1][0], P[0][1] - P[P.length - 1][1]) < 12) P.pop(); if (P.length >= 3) D.muralha = P; else HIST.pop() }
    else (F === "rua" ? D.ruas : D.agua).push(P); gravar() }
  desenhar() };
cv.addEventListener("pointerup", soltar); cv.addEventListener("pointercancel", soltar);
function apagarPerto(p) {
  let melhor = null, dm = 10;
  D.predios.forEach((q, i) => { const d = Math.hypot(q.x - p[0], q.z - p[1]); if (d < dm) { dm = d; melhor = () => D.predios.splice(i, 1) } });
  D.ruas.forEach((l, i) => { const d = dLinha(p, l); if (d < dm) { dm = d; melhor = () => D.ruas.splice(i, 1) } });
  D.agua.forEach((l, i) => { const d = dLinha(p, l); if (d < dm) { dm = d; melhor = () => D.agua.splice(i, 1) } });
  if (D.muralha) { const d = dLinha(p, [...D.muralha, D.muralha[0]]); if (d < dm) { dm = d; melhor = () => D.muralha = null } }
  if (melhor) { guardarHist(); melhor(); gravar(); desenhar() }
}

document.querySelectorAll(".ferr [data-f]").forEach(b => b.onclick = () => { F = b.dataset.f; document.querySelectorAll(".ferr [data-f]").forEach(c => c.setAttribute("aria-pressed", String(c === b))); $("#tipos").hidden = F !== "predio"; $("#dica").textContent = DICAS[F] });
document.querySelectorAll("#tipos [data-t]").forEach(b => b.onclick = () => { TIPO = b.dataset.t; document.querySelectorAll("#tipos [data-t]").forEach(c => c.setAttribute("aria-pressed", String(c === b))) });
$("#bt-desfazer").onclick = () => { const h = HIST.pop(); if (h) { D = JSON.parse(h); gravar(); desenhar() } };
$("#bt-limpar").onclick = e => { const b = e.currentTarget; if (!LIMPAR) { LIMPAR = 1; b.textContent = "Toque de novo"; setTimeout(() => { LIMPAR = 0; b.textContent = "Limpar" }, 2500); return }
  LIMPAR = 0; b.textContent = "Limpar"; guardarHist(); D = { nome: D.nome, muralha: null, ruas: [], agua: [], predios: [] }; gravar(); desenhar() };
$("#bt-3d").onclick = () => { gravar(); location.href = "cidade.html?desenho=1&nome=" + encodeURIComponent(D.nome) };
$("#dica").textContent = DICAS[F]; gravar(); desenhar();
</script>
</body>
</html>
