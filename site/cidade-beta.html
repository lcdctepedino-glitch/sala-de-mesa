<script>
const $ = s => document.querySelector(s), cv = $("#cv"), x = cv.getContext("2d"), MEIA = 300, CHAVE = "sm-cidade-beta";
const DICAS = { muralha: "Risque em volta da cidade. A muralha fecha sozinha. Dá para fazer várias: uma dentro da outra ou cidades vizinhas.", rua: "Risque as ruas. Onde a rua cruza a muralha nasce um portão; sem rua, o portão fica ao sul.", agua: "Risque um rio. Para um lago, risque em volta e volte ao começo. Rua por cima da água vira ponte.", predio: "Escolha o tipo e toque onde ele fica.", apagar: "Toque numa rua, rio ou prédio para apagar.", mover: "Arraste algo que já está no desenho para mudá-lo de lugar. Toque num prédio para girar. Arrastando o vazio, você anda pelo desenho." };
let F = "muralha", TIPO = "casa", D = ler(), HIST = [], traco = null, LIMPAR = 0;
function ler() { try { const d = JSON.parse(localStorage.getItem(CHAVE)); if (d && typeof d === "object") return { nome: d.nome || "Minha cidade", encher: !!d.encher, muralhas: d.muralhas || (d.muralha ? [d.muralha] : []), ruas: d.ruas || [], agua: d.agua || [], predios: d.predios || [] } } catch (e) { } return exemplo() }
/* primeira vez: um exemplo pronto, para ver como funciona */
function exemplo() { return { nome: "Minha cidade", encher: false, muralhas: [[[-70, -50], [0, -64], [70, -48], [82, 10], [55, 55], [-5, 62], [-62, 50], [-82, 5]]], ruas: [[[0, 140], [0, 0], [-60, -20]], [[0, 0], [70, -10]]], agua: [[[-140, -110], [-100, -80], [-110, 40], [-140, 120]]], predios: [{ x: 0, z: -2, t: "praca" }, { x: -14, z: -30, t: "taverna" }, { x: 30, z: -35, t: "templo" }] } }
function gravar() { D.nome = $("#nome").value.trim() || "Minha cidade"; try { localStorage.setItem(CHAVE, JSON.stringify(D)) } catch (e) { } }
function guardarHist() { HIST.push(JSON.stringify(D)); if (HIST.length > 60) HIST.shift() }
$("#nome").value = D.nome; $("#nome").oninput = gravar;
$("#encher").checked = !!D.encher; $("#encher").onchange = e => { D.encher = e.target.checked; gravar() };

/* metros ⇄ tela, com zoom (13/11): V.z = aproximação (1 = cidade inteira, até 8), V.x/V.y = ponto do mapa no meio da tela */
const V = { z: 2, x: 0, y: 0 };   // abre mostrando 300 m, como antes; afastando (até 1×) aparecem os 600 m
const k = () => cv.width / (2 * MEIA) * V.z, aTela = p => [(p[0] - V.x) * k() + cv.width / 2, (p[1] - V.y) * k() + cv.height / 2];
const pxCanvas = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * cv.width, (e.clientY - r.top) / r.height * cv.height] };
const deCanvas = q => [Math.round(((q[0] - cv.width / 2) / k() + V.x) * 10) / 10, Math.round(((q[1] - cv.height / 2) / k() + V.y) * 10) / 10];
const aMundo = e => deCanvas(pxCanvas(e));
function prender() { const meia = MEIA - MEIA / V.z; V.z = Math.max(1, Math.min(8, V.z)); V.x = Math.max(-meia, Math.min(meia, V.x)); V.y = Math.max(-meia, Math.min(meia, V.y)) }
/* aproxima mantendo parado o ponto q (em pixels do canvas) */
function zoomEm(q, fator) { const antes = deCanvas(q); V.z *= fator; prender(); const depois = deCanvas(q); V.x += antes[0] - depois[0]; V.y += antes[1] - depois[1]; prender(); desenhar(); const q2 = V.z / 2; $("#zoom-n").textContent = Math.abs(q2 - 1) < .05 ? "" : q2.toFixed(1).replace(".", ",") + "×" }
/* risco à mão vira poucos pontos (Douglas-Peucker); com zoom a tolerância diminui e o traço fica mais fiel */
function simplificar(P, tol) { if (P.length < 3) return P; const a = P[0], b = P[P.length - 1]; let im = 0, dm = 0; for (let i = 1; i < P.length - 1; i++) { const d = dSeg(P[i], a, b); if (d > dm) { dm = d; im = i } } return dm > tol ? simplificar(P.slice(0, im + 1), tol).slice(0, -1).concat(simplificar(P.slice(im), tol)) : [a, b] }
function dSeg(p, a, b) { const dx = b[0] - a[0], dz = b[1] - a[1], L2 = dx * dx + dz * dz || 1, t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dz) / L2)); return Math.hypot(p[0] - a[0] - t * dx, p[1] - a[1] - t * dz) }
const lago = l => l.length >= 3 && Math.hypot(l[0][0] - l[l.length - 1][0], l[0][1] - l[l.length - 1][1]) < 15;   // risco de água que volta ao começo = lago (a cidade 3D usa a mesma regra)
const dLinha = (p, l) => { let d = 1e9; for (let i = 1; i < l.length; i++) d = Math.min(d, dSeg(p, l[i - 1], l[i])); return d };

function desenhar() {
  const K = k(); x.fillStyle = "#6e9148"; x.fillRect(0, 0, cv.width, cv.height);
  /* grade de 25 m; com bastante zoom ganha linhas de 5 m */
  const grade = (passo, cor) => { x.strokeStyle = cor; x.lineWidth = 1; x.beginPath(); for (let m = -MEIA; m <= MEIA; m += passo) { const [t] = aTela([m, 0]), [, u] = aTela([0, m]); x.moveTo(t, 0); x.lineTo(t, cv.height); x.moveTo(0, u); x.lineTo(cv.width, u) } x.stroke() };
  if (V.z >= 3) grade(5, "rgba(0,0,0,.05)"); grade(25, "rgba(0,0,0,.1)");
  const linha = (l, cor, larg, fechar) => { if (!l || l.length < 2) return; x.strokeStyle = cor; x.lineWidth = larg * K; x.lineCap = x.lineJoin = "round"; x.beginPath(); l.forEach((p, i) => { const [a, b] = aTela(p); i ? x.lineTo(a, b) : x.moveTo(a, b) }); if (fechar) x.closePath(); x.stroke() };
  D.agua.forEach(l => { if (lago(l)) { x.fillStyle = "#4f7f96"; x.beginPath(); l.forEach((p, i) => { const [a, b] = aTela(p); i ? x.lineTo(a, b) : x.moveTo(a, b) }); x.closePath(); x.fill() } else linha(l, "#4f7f96", 9) });
  D.muralhas.forEach(m => { x.fillStyle = "rgba(230,216,181,.12)"; x.beginPath(); m.forEach((p, i) => { const [a, b] = aTela(p); i ? x.lineTo(a, b) : x.moveTo(a, b) }); x.closePath(); x.fill(); linha(m, "#7a7262", 3.4, true) });
  D.ruas.forEach(l => linha(l, "#b9ad94", 6));
  const COR = { casa: "#b5512f", taverna: "#a5492f", templo: "#8a3d28", torre: "#6e3424", praca: "#cfc3a6" }, TAM = { casa: [6, 10], taverna: [8, 12], templo: [8, 12], torre: [4, 4], praca: [24, 24] }, NOME = { casa: "Casa", taverna: "Taverna", templo: "Templo", torre: "Torre", praca: "Praça" };
  D.predios.forEach(p => { const [a, b] = aTela([p.x, p.z]), [w, h] = (TAM[p.t] || TAM.casa).map(v => v * K); x.fillStyle = COR[p.t] || COR.casa; if (p.t === "praca") { x.beginPath(); x.arc(a, b, w / 2, 0, 6.29); x.fill() } else { x.save(); x.translate(a, b); x.rotate((p.r || 0) * Math.PI / 180); x.fillRect(-w / 2, -h / 2, w, h); if (SEL === p) { x.strokeStyle = "#ffb070"; x.lineWidth = 3; x.strokeRect(-w / 2 - 3, -h / 2 - 3, w + 6, h + 6) } x.restore() }
    if (SEL === p && p.t === "praca") { x.strokeStyle = "#ffb070"; x.lineWidth = 3; x.beginPath(); x.arc(a, b, w / 2 + 3, 0, 6.29); x.stroke() }
    x.font = "600 " + Math.round(Math.max(18, Math.min(30, 4 * K))) + "px 'Atkinson Hyperlegible',sans-serif"; x.textAlign = "center"; x.lineWidth = 4; x.strokeStyle = "rgba(0,0,0,.6)"; x.strokeText(NOME[p.t], a, b - h / 2 - 6); x.fillStyle = "#f1ebe0"; x.fillText(NOME[p.t], a, b - h / 2 - 6) });
  if (traco) linha(traco.p, F === "agua" ? "#5f8fa8" : F === "rua" ? "#b9ad94" : "#7a7262", F === "agua" ? 9 : F === "rua" ? 6 : 3.4);
}

/* dedos na tela: 1 dedo desenha (ou arrasta, com Mover); 2 dedos aproximam e arrastam, e cancelam o risco que tinha começado */
const DEDOS = new Map(); let pinca = null, arrasto = null, levando = null, SEL = null;
/* o que está embaixo do dedo (prédio primeiro, depois rua, água e muralha); devolve como mover */
function pegar(p) {
  const tol = Math.max(2, 9 / V.z), arrastaLinha = l => (dx, dz) => l.forEach(q => { q[0] = Math.round((q[0] + dx) * 10) / 10; q[1] = Math.round((q[1] + dz) * 10) / 10 });
  let melhor = null, dm = tol;
  D.predios.forEach(q => { const d = Math.hypot(q.x - p[0], q.z - p[1]) - (q.t === "praca" ? 10 : 3); if (d < dm) { dm = d; melhor = { predio: q, mover: (dx, dz) => { q.x = Math.round((q.x + dx) * 10) / 10; q.z = Math.round((q.z + dz) * 10) / 10 } } } });
  if (melhor) return melhor;
  [...D.ruas, ...D.agua].forEach(l => { const d = dLinha(p, l); if (d < dm) { dm = d; melhor = { mover: arrastaLinha(l) } } });
  D.muralhas.forEach(m => { const d = dLinha(p, [...m, m[0]]); if (d < dm) { dm = d; melhor = { mover: arrastaLinha(m) } } });
  return melhor;
}
function mostrarGiro() { $("#giro").hidden = !SEL || SEL.t === "praca" || F !== "mover" }
function girar(g) { if (!SEL) return; guardarHist(); SEL.r = (((SEL.r || 0) + g) % 360 + 360) % 360; gravar(); desenhar() }
cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); DEDOS.set(e.pointerId, pxCanvas(e));
  if (DEDOS.size === 2) { traco = null; const [a, b] = [...DEDOS.values()]; pinca = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), m: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2] }; desenhar(); return }
  if (DEDOS.size > 2) return;
  const p = aMundo(e);
  if (F === "mover") { const alvo = pegar(p); SEL = alvo && alvo.predio || null; mostrarGiro(); if (alvo) { guardarHist(); levando = { alvo, ult: p } } else arrasto = pxCanvas(e); desenhar(); return }
  if (F === "predio") { guardarHist(); D.predios.push({ x: p[0], z: p[1], t: TIPO }); gravar(); desenhar(); return }
  if (F === "apagar") { apagarPerto(p); return }
  traco = { id: e.pointerId, p: [p] }; desenhar() });
cv.addEventListener("pointermove", e => { if (!DEDOS.has(e.pointerId)) return; DEDOS.set(e.pointerId, pxCanvas(e));
  if (pinca && DEDOS.size === 2) { const [a, b] = [...DEDOS.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    V.x -= (m[0] - pinca.m[0]) / k(); V.y -= (m[1] - pinca.m[1]) / k(); prender(); zoomEm(m, d / (pinca.d || d)); pinca = { d, m }; return }
  if (levando) { const p = aMundo(e), dx = p[0] - levando.ult[0], dz = p[1] - levando.ult[1]; levando.ult = p; levando.alvo.mover(dx, dz); desenhar(); return }
  if (arrasto) { const q = pxCanvas(e); V.x -= (q[0] - arrasto[0]) / k(); V.y -= (q[1] - arrasto[1]) / k(); arrasto = q; prender(); desenhar(); return }
  if (!traco || e.pointerId !== traco.id) return; const p = aMundo(e), u = traco.p[traco.p.length - 1]; if (Math.hypot(p[0] - u[0], p[1] - u[1]) > 1.5 / V.z) { traco.p.push(p); desenhar() } });
const soltar = e => { DEDOS.delete(e.pointerId); if (DEDOS.size < 2) pinca = null; if (!DEDOS.size) { arrasto = null; if (levando) { levando = null; gravar() } }
  if (!traco || e.pointerId !== traco.id) return; let P = simplificar(traco.p, Math.max(.4, 2.5 / V.z)); traco = null;
  const comp = P.reduce((s, q, i) => i ? s + Math.hypot(q[0] - P[i - 1][0], q[1] - P[i - 1][1]) : 0, 0);
  if (P.length >= 2 && comp > 2) { guardarHist();
    if (F === "muralha") { if (Math.hypot(P[0][0] - P[P.length - 1][0], P[0][1] - P[P.length - 1][1]) < Math.max(4, 12 / V.z)) P.pop(); if (P.length >= 3) D.muralhas.push(P); else HIST.pop() }
    else (F === "rua" ? D.ruas : D.agua).push(P); gravar() }
  desenhar() };
cv.addEventListener("pointerup", soltar); cv.addEventListener("pointercancel", soltar);
/* computador: rodinha do mouse aproxima onde o mouse está */
cv.addEventListener("wheel", e => { e.preventDefault(); zoomEm(pxCanvas(e), e.deltaY < 0 ? 1.2 : 1 / 1.2) }, { passive: false });
$("#g-esq").onclick = () => girar(-15); $("#g-dir").onclick = () => girar(15); $("#g-90").onclick = () => girar(90);
$("#z-mais").onclick = () => zoomEm([cv.width / 2, cv.height / 2], 1.5);
$("#z-menos").onclick = () => zoomEm([cv.width / 2, cv.height / 2], 1 / 1.5);
$("#z-tudo").onclick = () => { V.z = 1; V.x = V.y = 0; zoomEm([cv.width / 2, cv.height / 2], 1) };
function apagarPerto(p) {
  let melhor = null, dm = Math.max(2, 10 / V.z);
  D.predios.forEach((q, i) => { const d = Math.hypot(q.x - p[0], q.z - p[1]); if (d < dm) { dm = d; melhor = () => D.predios.splice(i, 1) } });
  D.ruas.forEach((l, i) => { const d = dLinha(p, l); if (d < dm) { dm = d; melhor = () => D.ruas.splice(i, 1) } });
  D.agua.forEach((l, i) => { const d = dLinha(p, l); if (d < dm) { dm = d; melhor = () => D.agua.splice(i, 1) } });
  D.muralhas.forEach((m, i) => { const d = dLinha(p, [...m, m[0]]); if (d < dm) { dm = d; melhor = () => D.muralhas.splice(i, 1) } });
  if (melhor) { guardarHist(); melhor(); gravar(); desenhar() }
}

document.querySelectorAll(".ferr [data-f]").forEach(b => b.onclick = () => { F = b.dataset.f; document.querySelectorAll(".ferr [data-f]").forEach(c => c.setAttribute("aria-pressed", String(c === b))); $("#tipos").hidden = F !== "predio"; SEL = null; mostrarGiro(); desenhar(); $("#dica").textContent = DICAS[F] });
document.querySelectorAll("#tipos [data-t]").forEach(b => b.onclick = () => { TIPO = b.dataset.t; document.querySelectorAll("#tipos [data-t]").forEach(c => c.setAttribute("aria-pressed", String(c === b))) });
$("#bt-desfazer").onclick = () => { const h = HIST.pop(); if (h) { D = JSON.parse(h); SEL = null; mostrarGiro(); gravar(); desenhar() } };
$("#bt-limpar").onclick = e => { const b = e.currentTarget; if (!LIMPAR) { LIMPAR = 1; b.textContent = "Toque de novo"; setTimeout(() => { LIMPAR = 0; b.textContent = "Limpar" }, 2500); return }
  LIMPAR = 0; b.textContent = "Limpar"; guardarHist(); D = { nome: D.nome, encher: D.encher, muralhas: [], ruas: [], agua: [], predios: [] }; SEL = null; mostrarGiro(); gravar(); desenhar() };
$("#bt-3d").onclick = () => { gravar(); location.href = "cidade.html?desenho=1&v=" + encodeURIComponent((document.querySelector('meta[name="sm-versao"]') || {}).content || "") + "&nome=" + encodeURIComponent(D.nome) };
$("#dica").textContent = DICAS[F]; gravar(); desenhar();
</script>
