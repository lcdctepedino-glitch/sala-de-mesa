<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<link rel="icon" href="data:,">
<title>Cidade · Mundo de UDA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="js/base.css">
<!-- Cidade em 3D para andar (desde 12/11/2026). Montada no navegador com peças de uso livre (CC0): casas do Medieval Village MegaKit, de Quaternius; móveis do Dungeon Remastered, de Kay Lousberg. As peças ficam em kit/. Não usa o banco. -->
<style>
/* O 3D ocupa a tela toda; os controles flutuam por cima, com as cores e letras do site (js/base.css). */
:root{--fundo:#050506;--vidro:rgba(6,6,8,.68);--tinta:var(--ink);--mudo:var(--mute);--escuro:#1a1208}
html,body{height:100%}
body{margin:0;padding:0;background:var(--fundo);color:var(--tinta);font-family:var(--f-ui);overflow:hidden}
[hidden]{display:none!important}
.grupo a{display:block;color:var(--tinta);font:700 13px/1 var(--f-ui);padding:11px 12px;text-decoration:none;white-space:nowrap}
.grupo a:focus-visible{outline:2px solid var(--perg);outline-offset:-2px}
#app{height:100%;display:grid;place-items:center;background:var(--fundo)}
#palco{position:relative;width:100%;height:100%;overflow:hidden;background:var(--fundo)}
#app.cel #palco{width:min(390px,100%);height:min(800px,100%);border:1px solid var(--borda);border-radius:26px}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.arrasta{cursor:grabbing}
.barra{position:absolute;z-index:4;margin:0;top:calc(10px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;pointer-events:none}
.barra>*{pointer-events:auto}
.nome{font:600 17px/1.1 var(--f-disp);color:var(--perg);text-shadow:0 0 6px #000;margin:0}
.lado{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-left:auto}
.grupo{display:flex;border-radius:10px;overflow:hidden;background:var(--vidro);border:1px solid var(--borda);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.grupo button{border:0;background:transparent;color:var(--mudo);font:700 13px/1 var(--f-ui);padding:11px 11px;cursor:pointer;white-space:nowrap}
.grupo button[aria-pressed="true"]{background:var(--perg);color:var(--escuro)}
.grupo button:focus-visible{outline:2px solid var(--perg);outline-offset:-2px}
.dica{position:absolute;z-index:3;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 32px);margin:0;text-align:center;font-size:12.5px;color:var(--mudo);background:var(--vidro);border:1px solid var(--borda);border-radius:12px;padding:7px 14px;pointer-events:none;transition:opacity .6s}
.dica.some{opacity:0}
#joy{position:absolute;z-index:4;left:max(20px,env(safe-area-inset-left,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));width:112px;height:112px;border-radius:50%;background:var(--vidro);border:1px solid var(--borda);touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--perg);opacity:.85;pointer-events:none}
#planta{position:absolute;z-index:6;inset:0;display:grid;place-items:center;align-content:center;gap:12px;background:rgba(0,0,0,.82);padding:70px 16px 24px}
#planta .quadro{position:relative;width:min(100%,calc(100vh - 190px),640px);aspect-ratio:1;max-width:100%;border:1px solid var(--borda);border-radius:10px;overflow:hidden}
#app.cel #planta .quadro{width:100%}
#planta canvas{width:100%;height:100%;display:block}
#planta .eu{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(0,0,0,.6),0 0 12px #fff}
#planta p{margin:0;max-width:44ch;text-align:center;font-size:13.5px;line-height:1.45;color:var(--tinta)}
#aviso{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;margin:0;color:var(--mudo);font-size:14px;pointer-events:none;background:var(--fundo)}
</style>
</head>
<body>

<div id="app">
  <div id="palco">
    <canvas id="gl" aria-label="Cidade em 3D"></canvas>
    <p id="aviso">Buscando as peças da cidade…</p>
    <div class="barra">
      <h1 class="nome" id="nome">Cidade murada</h1>
      <div class="lado">
        <div class="grupo" id="luzes" role="group" aria-label="Luz">
          <button type="button" data-l="dia" aria-pressed="true">Dia</button>
          <button type="button" data-l="anoitecer" aria-pressed="false">Anoitecer</button>
        </div>
        <div class="grupo"><button type="button" id="bt-planta" aria-pressed="false">Planta</button></div>
        <div class="grupo"><a href="index.html">Voltar ao mundo</a></div>
      </div>
    </div>
    <div id="joy" hidden><i></i></div>
    <p class="dica" id="dica"></p>
    <div id="planta" hidden>
      <div class="quadro"><div class="eu" id="eu"></div></div>
      <p>A cidade vista de cima. Cada telhado é uma casa montada com as peças do kit. Na cidade murada, casa de porta aberta dá para entrar. O ponto branco é você.</p>
    </div>
  </div>
</div>

<script src="js/three.min.js"></script>
<script>
(() => {
"use strict";
const T = window.THREE, $ = s => document.querySelector(s), aviso = $("#aviso"), BASE = "kit/";
if (!T) { aviso.textContent = "Não consegui carregar o motor 3D. Recarregue a página."; return }

/* ---------- utilidades ---------- */

const _e = new T.Euler(), _q = new T.Quaternion(), _p = new T.Vector3(), _s = new T.Vector3();

}
/* geometria nossa com textura (muralha, chão): caixas e discos com UV na medida do mundo */
class GeoT {

  quad(a, b, c, d, u0, v0, u1, v1) { this.p.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2], a[0], a[1], a[2], c[0], c[1], c[2], d[0], d[1], d[2]); this.u.push(u0, v0, u1, v0, u1, v1, u0, v0, u1, v1, u0, v1) }

}

/* ---------- o kit: peças e materiais ---------- */
const KIT = {}, MAT = {};
const carregador = new T.TextureLoader();

  MAT.WoodTrim_Wear = new T.MeshStandardMaterial({ map: MAT.WoodTrim.map, normalMap: MAT.WoodTrim.normalMap, roughness: .9, color: 0xd8cfc4, side: T.DoubleSide });
  MAT.RedBrick = new T.MeshStandardMaterial({ map: tex("RedBrick_c.jpg", 1), normalMap: MAT.Brick.normalMap, roughness: .9, side: T.DoubleSide });
  MAT.MetalOrnaments = new T.MeshStandardMaterial({ map: tex("MetalOrnaments_c.jpg", 1), roughness: .5, metalness: .5, side: T.DoubleSide });
  MAT.Vine = new T.MeshStandardMaterial({ map: tex("Vine_c.png", 1), color: 0x5fae3a, alphaTest: .5, roughness: .9, side: T.DoubleSide });
  MAT.Kay = new T.MeshStandardMaterial({ map: tex("Kay_c.png", 1), roughness: .7, side: T.DoubleSide });

async function carregarKit() {

  const n = new DataView(buf).getUint32(0, true), man = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 4, n))), d0 = 4 + n;
  for (const nome in man) KIT[nome] = man[nome].map(([m, off, vc, ic]) => { const o = d0 + off, g = new T.BufferGeometry();

/* coletor: junta cópias da mesma peça num desenho só, por setor da cidade (para esconder o que está fora da vista) */
const SETOR = 44;
class Lote {
  constructor() { this.m = new Map() }
  por(nome, M, aceso) { const pecas = KIT[nome]; if (!pecas) { console.warn("peça ausente", nome); return } const e = M.elements, st = Math.floor(e[12] / SETOR) + "," + Math.floor(e[14] / SETOR);
    const det = /^(Window|Door|Corner|Prop_Vine|Prop_Crate)/.test(nome);
    pecas.forEach((p, i) => { const k = st + "|" + nome + "|" + i; let a = this.m.get(k); if (!a) this.m.set(k, a = { st, p, e: [], luz: [], det: det && p.mat !== "WindowGlass", mov: nome.startsWith("K_") || nome.startsWith("Floor_") }); for (let j = 0; j < 16; j++) a.e.push(e[j]); a.luz.push(aceso ? 1 : 0) }) }
  construir(grupo, mundo) { const setores = new Map(); mundo.vidros = []; mundo.setores = [];
    for (const a of this.m.values()) { let s = setores.get(a.st); if (!s) { const [sx, sz] = a.st.split(",").map(Number); s = { g: new T.Group(), gd: new T.Group(), gm: new T.Group(), esf: new T.Sphere(new T.Vector3((sx + .5) * SETOR, 8, (sz + .5) * SETOR), SETOR * .71 + 16) }; setores.set(a.st, s); grupo.add(s.g); s.g.add(s.gd, s.gm); mundo.setores.push(s) }
      const n = a.luz.length, im = new T.InstancedMesh(a.p.geo, MAT[a.p.mat], n); im.instanceMatrix.array.set(a.e); im.frustumCulled = false; const vidro = a.p.mat === "WindowGlass"; im.castShadow = !vidro && a.p.mat !== "Vine"; im.receiveShadow = !vidro;
      if (vidro) { im.userData.luz = a.luz; mundo.vidros.push(im) } (a.mov ? s.gm : a.det ? s.gd : s.g).add(im) } }
}

/* ---------- uma casa montada com as peças ---------- */
const TELHADOS = { 4: [4, 6, 8], 6: [6, 8, 10, 12], 8: [8, 10, 12] };
const loc = (lx, lz, th, px, pz) => [lx + px * Math.cos(th) + pz * Math.sin(th), lz - px * Math.sin(th) + pz * Math.cos(th)];
function casa(L, R, o) {
  const { x, z, rot, W, C, n } = o, base = mat(x, 0, z, rot), por = (nome, lx, ly, lz, th, aceso) => { const M = base.clone().multiply(mat(lx, ly, lz, th)); L.por(nome, M, aceso); return M };

    if (R() < .6) por(R() < .5 ? "Prop_Chimney" : "Prop_Chimney2", (R() < .5 ? -1 : 1) * W / 4, yt + .5, (R() - .5) * C * .5, 0) }

  const mob = (nome, a, b, th, op) => { op = op || {}; th = th || 0; L.por("K_" + nome, base.clone().multiply(mat(a, op.y == null ? .12 : op.y, b, th, op.s || S))); if (op.b) { const h = loc(a, b, th, op.dx || 0, 0), w = rp(x, z, h[0], h[1], -rot); o.grade.ret(w[0], w[1], op.b[0], op.b[1], -(rot + th), 1) } };
  const ZB = { shelves: .25, banner_patternA_red: .38, banner_blue: .38, banner_shield_red: .32, banner_thin_green: .35, sword_shield: -.08 };
  const naParede = (nome, lado, t, y, sc) => { sc = sc || S; const zb = (ZB[nome] || 0) * sc, op = { y, s: sc }; if (lado === "B") mob(nome, t, -hz - zb, 0, op); else if (lado === "A") mob(nome, t, hz + zb, Math.PI, op); else if (lado === "C") mob(nome, hx + zb, t, -Math.PI / 2, op); else mob(nome, -hx - zb, t, Math.PI / 2, op) };
  const mesa = (nome, a, b, eixoX, q) => { mob(nome, a, b, 0, { b: [1.6, 1.6] }); const lug = eixoX ? [[-1.12, 0, Math.PI / 2], [1.12, 0, -Math.PI / 2]] : [[0, -1.12, 0], [0, 1.12, Math.PI]]; lug.slice(0, q || 2).forEach(g => mob(R() < .7 ? "chair" : "stool", a + g[0], b + g[1], g[2], { b: [.55, .55] })) };

/* ---------- vila aberta, em volta de um largo com árvore ---------- */

  const R = rng(4), meia = 120, P = Planta(1024, meia), grade = new Grade(meia, .5), grupo = new T.Group(), L = new Lote(), pedra = new GeoT(), calc = new GeoT(), mundo = { nome: "Vila aberta", meia, grade, grupo, limite: 112, inicio: { x: 0, z: 74, yaw: 0 } };
  chaoBase(grupo); P.x.fillStyle = "#6e9148"; P.x.fillRect(0, 0, 1024, 1024);
  calc.disco(0, .03, 0, 25, 25, 56, 2.4); calc.faixa(0, 20, 0, meia + 40, 6, .03, 2.4); calc.faixa(-20, 0, -70, -8, 5, .03, 2.4); calc.faixa(20, 0, 72, 10, 5, .03, 2.4);
  P.ret(0, 70, 6, 100, 0, "#9a917e"); P.elipse(0, 0, 25, 25, "#9a917e"); P.elipse(0, 0, 8.5, 8.5, "#6e9148");
  const verde = new T.Mesh(new T.CircleGeometry(8.5, 40), matGrama); verde.rotation.x = -Math.PI / 2; verde.position.y = .07; verde.receiveShadow = true; grupo.add(verde);
  for (let a = 0; a < 6.283; a += .262) pedra.caixa(Math.cos(a) * 8.7, 0, Math.sin(a) * 8.7, 2.3, .45, .5, a + 1.5708, 2.5); grade.circ(0, 0, 1.2, 1);
  const arv = [[0, 0, 2.6]];
  /* dois anéis de casas viradas para o largo */
  let nCasas = 0; const anel = (raio, q, fase, pula) => { for (let i = 0; i < q; i++) { const a = fase + i / q * 6.2832; if (pula(a)) continue; const ta = R() < .5, W = ta ? (R() < .5 ? 4 : 6) : 6, C = ta ? 8 : [6, 8, 10][Math.floor(R() * 3)], prof = ta ? C : W, frente = ta ? W : C, d = raio + prof / 2, x = Math.cos(a) * d, z = Math.sin(a) * d, olha = Math.atan2(-x, -z) + (R() - .5) * .12;
      casa(L, R, { x, z, rot: ta ? olha : olha - Math.PI / 2, W, C, n: R() < .35 ? 1 : R() < .85 ? 2 : 3, porta: ta ? "A" : "C" }); grade.ret(x, z, frente + .5, prof + .5, -olha, 1); P.ret(x, z, frente + 1.4, prof + 1.4, -olha, ["#b5512f", "#a5492f", "#c05c35"][nCasas++ % 3]);
      if (R() < .6) { const lado = R() < .5 ? -1 : 1, q2 = rp(x, z, lado * (frente / 2 + 2.2), 0, -olha); for (let k = 0; k < 3; k++) { const f = rp(q2[0], q2[1], 0, (k - 1) * 2, -olha); L.por("Prop_WoodenFence_Single", mat(f[0], 0, f[1], olha + Math.PI / 2)) } grade.ret(q2[0], q2[1], .5, 6, -olha, 1) }
      if (R() < .5) { const c = rp(x, z, (R() - .5) * frente * .6, prof / 2 + 1, -olha); L.por("Prop_Crate", mat(c[0], 0, c[1], R(), .85)); grade.circ(c[0], c[1], .7, 1) } } };
  const naRua = a => { const s = Math.sin(a), c = Math.cos(a); return (s > .93) || (c < -.95 && Math.abs(s) < .3) || (c > .95 && Math.abs(s) < .3) };
  anel(27.5, 11, .28, naRua); anel(52, 15, .1, a => naRua(a) || R() < .25);
  barraca(L, grade, R, -13, 9, .9); barraca(L, grade, R, 14, -10, -2.2); L.por("Prop_Wagon", mat(13, 0, 12, -.8)); grade.circ(13, 12, 1.6, 1); L.por("Prop_Wagon", mat(-6, 0, 40, .2)); grade.circ(-6, 40, 1.6, 1);
  for (let i = 0; i < 210; i++) { const a = R() * 6.283, d = 16 + R() * 98, x = Math.cos(a) * d, z = Math.sin(a) * d; if (d < 25.5 || grade.ver(x, z) || grade.ver(x + 2, z) || grade.ver(x - 2, z) || grade.ver(x, z + 2) || grade.ver(x, z - 2) || (Math.abs(x) < 6 && z > 0) || (d < 76 && R() < .55)) continue; arv.push([x, z, 1 + R() * 1]); grade.circ(x, z, .6, 1); P.elipse(x, z, 2.4, 2.4, "#3f6f3a") }
  P.elipse(0, 0, 4.5, 4.5, "#3f6f3a"); arvores(grupo, arv, R);
  grupo.add(pedra.malha(MAT.Brick), calc.malha(MAT.UnevenBrick)); L.construir(grupo, mundo); mundo.planta = P.c; return mundo;
}

/* ---------- jogador ---------- */
const MUNDOS = {}, J = { x: 0, z: 0, yaw: 0, pit: 0, passo: 0 }, tec = {}, joy = { x: 0, y: 0 };
let M = null, ultimo = 0, sombraEm = null;
const palco = $("#palco"), gl = $("#gl"), dica = $("#dica"), app = $("#app"), toque = matchMedia("(pointer: coarse)").matches;
function trocar(v) {
  if (M) cena.remove(M.grupo); M = MUNDOS[v] || (MUNDOS[v] = v === "vila" ? fazerVila() : fazerMurada()); cena.add(M.grupo); aplicarLuz(luzAtual); J.x = M.inicio.x; J.z = M.inicio.z; J.yaw = M.inicio.yaw; J.pit = 0;
  $("#nome").textContent = NOME_LUGAR || M.nome; if (NOME_LUGAR) document.title = NOME_LUGAR + " · Mundo de UDA"; document.querySelectorAll("#versoes button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === v)));
  const q = $("#planta .quadro"), velho = q.querySelector("canvas"); if (velho) velho.remove(); q.insertBefore(M.planta, q.firstChild);
}
const livre = (x, z) => x * x + z * z < M.limite * M.limite && !M.grade.ver(x, z);
const pode = (x, z) => livre(x + .28, z) && livre(x - .28, z) && livre(x, z + .28) && livre(x, z - .28);
const frust = new T.Frustum(), pm = new T.Matrix4();
function quadro(t) {
  requestAnimationFrame(quadro); const dt = Math.min(.05, (t - ultimo) / 1000 || 0); ultimo = t;
  let f = (tec.w || tec.arrowup ? 1 : 0) - (tec.s || tec.arrowdown ? 1 : 0) - joy.y, s = (tec.d || tec.arrowright ? 1 : 0) - (tec.a || tec.arrowleft ? 1 : 0) + joy.x;
  const mag = Math.hypot(f, s); if (mag > 1) { f /= mag; s /= mag }
  const vel = (tec.shift ? 8 : 4.4) * dt, dx = (-Math.sin(J.yaw) * f + Math.cos(J.yaw) * s) * vel, dz = (-Math.cos(J.yaw) * f - Math.sin(J.yaw) * s) * vel;
  if (dx && pode(J.x + dx, J.z)) J.x += dx; if (dz && pode(J.x, J.z + dz)) J.z += dz; if (mag > .05) J.passo += dt * 9;
  cam.position.set(J.x, 1.68 + Math.sin(J.passo) * (mag > .05 ? .03 : 0), J.z); cam.rotation.y = J.yaw; cam.rotation.x = J.pit; cam.updateMatrixWorld(); ceu.position.copy(cam.position);
  /* a sombra segue o jogador aos saltos de 10 m; só é recalculada quando salta */
  const gx = Math.round(J.x / 10) * 10, gz = Math.round(J.z / 10) * 10, chave = gx + "," + gz + luzAtual, novaSombra = chave !== sombraEm;
  if (novaSombra) { sombraEm = chave; sol.target.position.set(gx, 0, gz); sol.position.set(gx + dirSol.x * 160, dirSol.y * 160, gz + dirSol.z * 160); sol.target.updateMatrixWorld(); rd.shadowMap.needsUpdate = true }
  frust.setFromProjectionMatrix(pm.multiplyMatrices(cam.projectionMatrix, cam.matrixWorldInverse));
  for (const st of M.setores) { const d = Math.hypot(st.esf.center.x - J.x, st.esf.center.z - J.z); st.g.visible = (novaSombra && d < 110) || (d < cena.fog.far + 50 && frust.intersectsSphere(st.esf)); st.gd.visible = d < 95; st.gm.visible = d < 62 }
  let perto = null, dp = 1e9; for (const c of M.abertas || []) { const d = Math.hypot(c.x - J.x, c.z - J.z); if (d < dp) { dp = d; perto = c } }
  if (perto && dp < perto.r + 6) { luzCasa.position.set(perto.x, 2.2, perto.z); luzCasa.intensity += ((luzAtual === "dia" ? 1.1 : 2) - luzCasa.intensity) * .1 } else luzCasa.intensity *= .9;
  if (!$("#planta").hidden) { const e = $("#eu"); e.style.left = (J.x + M.meia) / (2 * M.meia) * 100 + "%"; e.style.top = (J.z + M.meia) / (2 * M.meia) * 100 + "%" }
  rd.render(cena, cam);
}

/* ---------- controles ---------- */
addEventListener("keydown", e => { const k = e.key.toLowerCase(); tec[k] = 1; if (k.startsWith("arrow")) e.preventDefault(); sumirDica() });
addEventListener("keyup", e => { tec[e.key.toLowerCase()] = 0 }); addEventListener("blur", () => { for (const k in tec) tec[k] = 0 });
let arr = null;
gl.addEventListener("pointerdown", e => { arr = { id: e.pointerId, x: e.clientX, y: e.clientY }; gl.setPointerCapture(e.pointerId); gl.classList.add("arrasta") });
gl.addEventListener("pointermove", e => { if (!arr || e.pointerId !== arr.id) return; const k = e.pointerType === "touch" ? .006 : .0042; J.yaw -= (e.clientX - arr.x) * k; J.pit = Math.max(-1.15, Math.min(1.15, J.pit - (e.clientY - arr.y) * k)); arr.x = e.clientX; arr.y = e.clientY; sumirDica() });
const solta = e => { if (arr && e.pointerId === arr.id) { arr = null; gl.classList.remove("arrasta") } }; gl.addEventListener("pointerup", solta); gl.addEventListener("pointercancel", solta);
const elJoy = $("#joy"), pino = elJoy.querySelector("i"); let jid = null;
const moverJoy = e => { const r = elJoy.getBoundingClientRect(); let x = (e.clientX - r.left - r.width / 2) / (r.width / 2 - 14), y = (e.clientY - r.top - r.height / 2) / (r.height / 2 - 14); const m = Math.hypot(x, y); if (m > 1) { x /= m; y /= m } joy.x = x; joy.y = y; pino.style.transform = "translate(" + x * 33 + "px," + y * 33 + "px)" };
elJoy.addEventListener("pointerdown", e => { jid = e.pointerId; elJoy.setPointerCapture(jid); moverJoy(e); sumirDica(); e.preventDefault() });
elJoy.addEventListener("pointermove", e => { if (e.pointerId === jid) moverJoy(e) });
const soltaJoy = e => { if (e.pointerId === jid) { jid = null; joy.x = joy.y = 0; pino.style.transform = "" } }; elJoy.addEventListener("pointerup", soltaJoy); elJoy.addEventListener("pointercancel", soltaJoy);
let dicaFoi = false; function sumirDica() { if (dicaFoi) return; dicaFoi = true; setTimeout(() => dica.classList.add("some"), 2500) }
function aparelho(a) { app.classList.toggle("cel", a === "cel"); const comJoy = toque || a === "cel"; elJoy.hidden = !comJoy; dica.textContent = comJoy ? "Direcional para andar · arraste a tela para olhar" : "W A S D para andar · arraste para olhar · Shift corre";
  document.querySelectorAll("#aparelho button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.a === a))); medir() }
function medir() { const w = palco.clientWidth, h = palco.clientHeight; if (!w || !h) return; rd.setSize(w, h, false); cam.aspect = w / h; cam.fov = w < h ? 78 : 66; cam.updateProjectionMatrix() }
document.querySelectorAll("#versoes button").forEach(b => b.onclick = () => { aviso.textContent = "Erguendo a cidade…"; aviso.hidden = false; setTimeout(() => { trocar(b.dataset.v); aviso.hidden = true }, 40) });
document.querySelectorAll("#luzes button").forEach(b => b.onclick = () => aplicarLuz(b.dataset.l));
document.querySelectorAll("#aparelho button").forEach(b => b.onclick = () => aparelho(b.dataset.a));
$("#bt-planta").onclick = () => { const p = $("#planta"); p.hidden = !p.hidden; $("#bt-planta").setAttribute("aria-pressed", String(!p.hidden)) };
$("#planta").onclick = () => { $("#planta").hidden = true; $("#bt-planta").setAttribute("aria-pressed", "false") };
new ResizeObserver(medir).observe(palco);
document.querySelector(".grupo a").addEventListener("click", () => { try { sessionStorage.setItem("sm-volta-cidade", NOME_LUGAR || "Ipanema") } catch (e) { } });   // o Início reabre o mundo em cima deste lugar
window.__cidade = { abertas: () => M.abertas || [], pode: (x, z) => pode(x, z), ir(x, z, yaw, pit) { J.x = x; J.z = z; J.yaw = yaw || 0; J.pit = pit || 0 }, trocar, aplicarLuz, J, info: () => ({ tri: rd.info.render.triangles, chamadas: rd.info.render.calls }) };

carregarKit().then(() => { materiais(); comuns(); aviso.textContent = "Erguendo a cidade…"; setTimeout(() => { try { trocar("murada"); aparelho("pc"); aviso.hidden = true; requestAnimationFrame(quadro) } catch (e) { console.error(e); aviso.textContent = "Não consegui erguer a cidade neste aparelho." } }, 30) })
  .catch(e => { console.error(e); aviso.textContent = "Não consegui buscar as peças da cidade. Recarregue a página." });
})();
