<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<link rel="icon" href="data:,">
<title>Meus mundos · Sala de Mesa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,600;1,600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="js/base.css">
<style>
/* Criador de mundos: opção 3 (Passo a passo) aprovada em 03/11/2026, com botão para a opção 2 (Tela livre) e de volta.
   O visual definitivo vem depois; aqui vale o funcionamento. Os mapas são pergaminho e tinta. */
:root{--perg:#e6d8b5;--tinta:#3a2e20;--brasa:#8a3a26}
/* ---------- Meus mundos (lista) ---------- */
.mcard{display:grid;grid-template-columns:128px minmax(0,1fr);gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.mcard canvas{width:128px;height:86px;border-radius:8px;background:#a3b9b4;display:block}
.mcard b{font:600 18px/1.2 var(--f-disp);display:block;overflow-wrap:anywhere}
.mcard small{color:var(--mute);font-size:13px;display:block}
.mcard .acoes{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.radios{display:grid;gap:8px}
.ck{display:flex;gap:9px;align-items:center;font-size:15px;padding:2px 0}
.ck input{width:18px;height:18px;accent-color:var(--perg);flex:none;padding:0;margin:0}
/* ---------- editor ---------- */
body.editando{overflow:hidden}
#ed{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr)}
:where(#ed) :is(button,input,select){font:inherit;color:inherit}
:where(#ed) button{cursor:pointer}
#ed :focus-visible{outline:2px solid var(--perg);outline-offset:2px}
.barra{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:max(8px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.barra .nm{font:600 18px var(--f-disp);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 120px}
.barra .st{font-size:13px;color:var(--mute);white-space:nowrap}
.barra .st.erro{color:var(--erro)}
.barra .modo{flex:none}
#app{position:relative;min-height:0;container-type:inline-size}
.tela{position:relative;min-width:0;min-height:0;overflow:hidden;touch-action:none;background:#101114}
.tela canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ferr{display:grid;justify-items:center;align-content:center;gap:3px;padding:8px 4px;border-radius:11px;border:1px solid transparent;background:none;color:var(--mute);font-weight:700;font-size:12px;line-height:1.1}
.ferr svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ferr:hover{color:var(--ink)}
.ferr[aria-pressed="true"]{background:var(--perg);color:var(--tinta)}
.mbt{white-space:nowrap;border:1px solid var(--borda);background:none;border-radius:10px;padding:7px 12px;font-weight:700;font-size:14px;color:var(--ink);display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.mbt svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mbt.forte{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mbt.conf{background:var(--brasa);border-color:var(--brasa);color:var(--ink)}
.mbt:disabled{opacity:.4;cursor:default}
.h4{margin:0 0 8px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);font-weight:700}
.dica{color:var(--mute);font-size:14px;margin:0}
.sw{display:flex;flex-wrap:wrap;gap:6px}
.sw button{display:flex;align-items:center;gap:7px;border:1px solid var(--borda);background:var(--campo);border-radius:999px;padding:5px 11px 5px 6px;font-size:13px;font-weight:700}
.sw i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.35);display:block}
.sw button[aria-pressed="true"]{border-color:var(--perg);box-shadow:0 0 0 1px var(--perg)}
.tams{display:flex;gap:6px;align-items:center}
.tams button{width:34px;height:34px;border-radius:50%;border:1px solid var(--borda);background:var(--campo);display:grid;place-items:center;padding:0}
.tams button i{display:block;border-radius:50%;background:var(--ink)}
.tams button[aria-pressed="true"]{border-color:var(--perg);box-shadow:0 0 0 1px var(--perg)}
.cp{display:grid;gap:4px}
.cp span{font-size:13px;color:var(--mute)}
.cp input{width:100%;background:var(--campo);border:1px solid var(--borda);border-radius:10px;padding:9px 11px;font-size:15px}
.seg{display:flex;border:1px solid var(--borda);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:none;padding:7px 10px;font-weight:700;font-size:13px;color:var(--mute);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--perg);color:var(--tinta)}
.trilha{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;white-space:nowrap}
.trilha button{border:0;background:none;color:var(--mute);font:600 16px var(--f-disp);padding:2px 4px;text-overflow:ellipsis;overflow:hidden}
.trilha b{font:600 17px var(--f-disp);overflow:hidden;text-overflow:ellipsis}
.trilha em{color:var(--borda);font-style:normal}
.mini{display:block;width:100%;height:auto;border-radius:8px;background:#a3b9b4;aspect-ratio:3/2}
.troca{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.troca input{width:20px;height:20px;accent-color:var(--perg);padding:0}
/* Tela livre */
.p2{position:absolute;inset:0}
.p2>.tela{position:absolute;inset:0}
.flut{position:absolute;background:rgba(23,24,28,.93);border:1px solid var(--borda);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:2}
.p2 .chips{left:14px;top:14px;border-radius:999px;padding:5px 12px;max-width:calc(100% - 150px)}
.p2 .desf{right:14px;top:14px;border-radius:999px;padding:4px;display:flex;gap:2px}
.p2 .desf button{border:0;background:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;padding:0}
.p2 .desf button[aria-pressed="true"]{background:var(--perg);color:var(--tinta)}
.p2 .desf svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.p2 .dock{left:50%;bottom:16px;transform:translateX(-50%);border-radius:999px;padding:7px;display:flex;gap:4px}
.p2 .dock .ferr{width:64px;height:64px;border-radius:50%;padding:0;font-size:11px}
.p2 .bandeja{left:50%;bottom:98px;transform:translateX(-50%);border-radius:16px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:center;width:max-content;max-width:calc(100% - 28px)}
.p2 .bandeja .dica{max-width:46ch;text-align:center}
.p2 .cartao{right:14px;top:70px;width:300px;max-height:calc(100% - 190px);overflow:auto;border-radius:16px;padding:14px;display:grid;gap:10px}
.p2 .cartao h3{margin:0;font:600 19px var(--f-disp)}
@container (max-width:700px){
  .p2 .cartao{left:12px;right:12px;width:auto;top:66px}
  .p2 .dock .ferr{width:52px;height:52px;font-size:10px}
  .p2 .bandeja{bottom:84px}
}
/* Passo a passo */
.p3{position:absolute;inset:0;display:grid;grid-template-columns:260px minmax(0,1fr)}
.p3 .esq{border-right:1px solid var(--line);overflow:auto;padding:16px;display:grid;align-content:start;gap:14px}
.p3 .passos{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.p3 .passo{width:100%;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;padding:9px 10px;border-radius:12px;background:none;border:1px solid transparent;text-align:left;color:var(--mute)}
.p3 .passo .n{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--borda);display:grid;place-items:center;font-weight:700;font-size:14px}
.p3 .passo b{display:block;color:var(--ink);font-size:15px}
.p3 .passo small{font-size:13px}
.p3 .passo[aria-current="step"]{background:var(--card);border-color:var(--borda)}
.p3 .passo[aria-current="step"] .n{background:var(--perg);color:var(--tinta);border-color:var(--perg)}
.p3 .passo.feito .n{border-color:var(--perg);color:var(--perg)}
.p3 .meio{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-width:0;min-height:0}
.p3 .faixa{padding:12px 16px;border-bottom:1px solid var(--line);display:grid;gap:10px;min-width:0;max-height:46vh;overflow:auto}
.p3 .faixa h2{margin:0;font:600 22px/1.2 var(--f-disp)}
.p3 .linha{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.p3 .linha .ferr{display:flex;gap:6px;padding:7px 11px;border:1px solid var(--borda);font-size:13px}
.p3 .linha .ferr svg{width:18px;height:18px}
.p3 .cands{display:grid;grid-template-columns:repeat(3,minmax(0,140px));gap:8px}
.p3 .cands button{border:2px solid transparent;border-radius:10px;padding:0;background:none}
.p3 .cands button:hover{border-color:var(--perg)}
.p3 .rodape{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px max(10px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.p3 .pronto{background:var(--card);border-radius:14px;padding:14px;display:grid;gap:8px}
@container (max-width:780px){
  .p3{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .p3 .esq{border-right:0;border-bottom:1px solid var(--line);padding:6px 10px}
  .p3 .passos{display:flex;overflow-x:auto}
  .p3 .passo{grid-template-columns:auto;min-width:max-content;padding:6px 8px}
  .p3 .passo small{display:none}
  .p3 .faixa{padding:10px 12px;max-height:40vh}
  .p3 .faixa h2{font-size:19px}
  .p3 .cands{grid-template-columns:repeat(3,minmax(0,1fr))}
  .p3 .rodape{padding-left:12px;padding-right:12px}
  .p3 .rodape .desf span{display:none}
}
</style>
</head>
<body>
<!-- ======== Meus mundos ======== -->
<main class="pag" id="lib" hidden>
  <a class="lnk" href="index.html">‹ Início</a>
  <div style="display:grid;gap:6px"><h1>Meus mundos</h1><p class="mute">Os mundos são seus. Cada um pode valer para várias mesas, e cada mesa guarda o que os jogadores já descobriram.</p></div>
  <p class="msg erro" id="lib-erro" hidden></p>
  <section><div id="l-mundos"></div></section>
  <section>
    <h2>Criar um mundo</h2>
    <form class="caixa" id="f-novo" novalidate>
      <label class="campo"><span>Nome do mundo</span><input id="in-nome" maxlength="60" placeholder="Ex.: Reino de Aster" autocomplete="off"></label>
      <div class="radios" role="radiogroup" aria-label="Como começar">
        <label class="ck"><input type="radio" name="comeco" value="pronto" checked> Começar com um continente pronto para ajustar</label>
        <label class="ck"><input type="radio" name="comeco" value="mar"> Começar só com mar e desenhar do zero</label>
        <label class="ck"><input type="radio" name="comeco" value="imagem"> Enviar uma imagem de mapa que eu já tenho</label>
      </div>
      <label class="campo" id="c-img" hidden><span>Imagem do mapa (JPG ou PNG)</span><input type="file" id="in-img" accept="image/png,image/jpeg,image/webp"></label>
      <p class="msg" id="novo-msg" role="status"></p>
      <button class="bt" type="submit" id="bt-novo">Criar e abrir</button>
    </form>
  </section>
</main>

<!-- ======== Editor ======== -->
<div id="ed" hidden>
  <header class="barra">
    <a class="mbt" href="mundos.html" id="bt-voltar">‹ Mundos</a>
    <span class="nm" id="nm"></span>
    <span class="st" id="st" role="status"></span>
    <div class="seg modo" role="group" aria-label="Jeito de editar"><button type="button" data-modo="passos">Passo a passo</button><button type="button" data-modo="livre">Tela livre</button></div>
  </header>
  <div id="app"></div>
  <input type="file" id="arq" accept="image/png,image/jpeg,image/webp" hidden>
</div>

<script src="js/supabase.js"></script>
<script src="js/comum.js"></script>
<script>
const $ = s => document.querySelector(s);
const WID = smParam("w");
let EU = null, M = null, MESAS = [];

/* =================== dados e desenho (motor do protótipo aprovado) =================== */
const C = 10, CP = 20, LARG = 1200, LARGP = 800;   // célula do mundo, quadrado da planta, largura do mapa/planta quando é imagem
const TER = [{ n: "Mar", c: "#a3b9b4" }, { n: "Campo", c: "#e6d8b5" }, { n: "Floresta", c: "#bcc597" }, { n: "Montanha", c: "#d3bf99" }, { n: "Deserto", c: "#efdca6" }];
const TINTA = "#3a2e20", PISO = "#f7f0de", HALO = "rgba(236,224,192,.96)";
const RAIOS = [1, 2, 3, 5, 8];
const uid = () => crypto.randomUUID();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ent = v => Math.min(1, Math.max(0, v));

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } }
function ruido(seed, w, h, e) {
  const r = rng(seed), gw = Math.ceil(w / e) + 2, gh = Math.ceil(h / e) + 2, g = new Float32Array(gw * gh).map(() => r());
  const s = t => t * t * (3 - 2 * t);
  return (x, y) => { const fx = x / e, fy = y / e, ix = Math.floor(fx), iy = Math.floor(fy), u = s(fx - ix), v = s(fy - iy), a = g[iy * gw + ix], b = g[iy * gw + ix + 1], c = g[(iy + 1) * gw + ix], d = g[(iy + 1) * gw + ix + 1]; return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v };
}
function gerar(cel, w, h, seed) {
  const o = [ruido(seed, w, h, 26), ruido(seed + 1, w, h, 13), ruido(seed + 2, w, h, 6), ruido(seed + 3, w, h, 3)];
  const fl = ruido(seed + 9, w, h, 9), de = ruido(seed + 17, w, h, 15);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let v = o[0](x, y) * .5 + o[1](x, y) * .27 + o[2](x, y) * .15 + o[3](x, y) * .08;
    const dx = (x - w / 2) / (w * .5), dy = (y - h / 2) / (h * .5); v = v - (dx * dx + dy * dy) * .55 + .17;
    let t = 0; if (v > .5) { t = 1; if (v > .69) t = 3; else if (fl(x, y) > .57) t = 2; else if (de(x, y) > .63 && v < .6) t = 4 }
    cel[y * w + x] = t;
  }
}
function b64(a) { let s = ""; for (let i = 0; i < a.length; i += 8192) s += String.fromCharCode.apply(null, a.subarray(i, i + 8192)); return btoa(s) }
function deB64(s, n) { const a = new Uint8Array(n); try { const b = atob(s || ""); for (let i = 0; i < Math.min(n, b.length); i++) a[i] = b.charCodeAt(i) } catch (e) { } return a }
function novoMapa(seed, gerado) { const w = 120, h = 80, cel = new Uint8Array(w * h); if (gerado) gerar(cel, w, h, seed); return { w, h, cel } }
function novaPlanta() { const w = 40, h = 28; return { id: uid(), fonte: "desenho", w, h, piso: new Uint8Array(w * h), portas: new Set(), rotulos: [], imagem: null, largura: null, altura: null, imgEl: null } }
const dimsMundo = X => X.fonte === "imagem" && X.largura ? [LARG, LARG * X.altura / X.largura] : [X.mapa.w * C, X.mapa.h * C];
const dimsPlanta = P => P.fonte === "imagem" && P.largura ? [LARGP, LARGP * P.altura / P.largura] : [P.w * CP, P.h * CP];

/* imagem do Storage (guardada no aparelho pelo smImagem) */
function carregaImg(o) {
  if (!o.imagem || (o.imgEl && o.imgDe === o.imagem) || o.pedindo === o.imagem) return;
  const c = o.pedindo = o.imagem;
  smImagem(c).then(url => { const im = new Image(); im.onload = () => { if (o.imagem === c) { o.imgEl = im; o.imgDe = c; redesenhar() } }; im.src = url })
    .catch(() => { o.pedindo = null; o.imgErro = c; redesenhar() });
}
function redesenhar() { if (S.ed) S.ed.pedir(); document.querySelectorAll("canvas[data-mini]").forEach(cv => { const X = LIB[cv.dataset.mini]; if (X) desenhaMini(cv, X) }) }

/* --------- pintar --------- */
function pintaMundo(X, p0, p1, r, t) {
  const { w, h, cel } = X.mapa, d = Math.hypot(p1.x - p0.x, p1.y - p0.y), n = Math.max(1, Math.ceil(d / (C * .5)));
  for (let i = 0; i <= n; i++) {
    const cx = (p0.x + (p1.x - p0.x) * i / n) / C, cy = (p0.y + (p1.y - p0.y) * i / n) / C;
    for (let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++) for (let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++) {
      if (x < 0 || y < 0 || x >= w || y >= h) continue;
      if ((x + .5 - cx) ** 2 + (y + .5 - cy) ** 2 <= r * r + .3) cel[y * w + x] = t;
    }
  }
}
const celP = (P, p) => [Math.min(P.w - 1, Math.max(0, Math.floor(p.x / CP))), Math.min(P.h - 1, Math.max(0, Math.floor(p.y / CP)))];
function pintaPiso(P, p0, p1, v) {
  const d = Math.hypot(p1.x - p0.x, p1.y - p0.y), n = Math.max(1, Math.ceil(d / (CP * .4)));
  for (let i = 0; i <= n; i++) { const [x, y] = celP(P, { x: p0.x + (p1.x - p0.x) * i / n, y: p0.y + (p1.y - p0.y) * i / n }); P.piso[y * P.w + x] = v }
}
function encheSala(P, a, b) { for (let y = Math.min(a[1], b[1]); y <= Math.max(a[1], b[1]); y++) for (let x = Math.min(a[0], b[0]); x <= Math.max(a[0], b[0]); x++) P.piso[y * P.w + x] = 1 }
function trocaPorta(P, p) {
  const x = p.x / CP, y = p.y / CP, cx = Math.floor(x), cy = Math.floor(y), fx = x - cx, fy = y - cy;
  const op = [[fy, `${cx},${cy},h`], [1 - fy, `${cx},${cy + 1},h`], [fx, `${cx},${cy},v`], [1 - fx, `${cx + 1},${cy},v`]].sort((a, b) => a[0] - b[0])[0][1];
  if (P.portas.has(op)) P.portas.delete(op); else P.portas.add(op);
}
function trocaNumero(P, p) {
  const [x, y] = celP(P, p), i = P.rotulos.findIndex(r => r.x === x && r.y === y);
  if (i >= 0) { P.rotulos.splice(i, 1); return }
  if (!P.piso[y * P.w + x]) return;
  P.rotulos.push({ x, y, n: P.rotulos.reduce((m, r) => Math.max(m, r.n), 0) + 1 });
}
function lugarEm(X, p, z) { const r = 14 / z; let mel = null, md = r * r; for (const l of X.lugares) { const d = (l.x - p.x) ** 2 + (l.y - p.y) ** 2; if (d < md) { md = d; mel = l } } return mel }

function hsh(x, y) { let h = x * 374761393 + y * 668265263; h = Math.imul(h ^ (h >>> 13), 1274126177); return (h ^ (h >>> 16)) >>> 0 }
function aviso(c, W, H, z, txt) { c.fillStyle = "#2a2c31"; c.fillRect(0, 0, W, H); c.fillStyle = "#a9a69d"; c.font = `700 ${15 / z}px "Atkinson Hyperlegible", sans-serif`; c.textAlign = "center"; c.textBaseline = "middle"; c.fillText(txt, W / 2, H / 2) }
function desenhaMundo(c, X, z, o = {}) {
  const [W, H] = dimsMundo(X), s = 1 / z;
  if (X.fonte === "imagem") {
    if (X.imgEl && X.imgDe === X.imagem) c.drawImage(X.imgEl, 0, 0, W, H);
    else aviso(c, W, H, z, X.imgErro === X.imagem ? "Não consegui abrir a imagem" : "Carregando a imagem…");
  } else {
    const { w, h, cel } = X.mapa;
    c.fillStyle = TER[0].c; c.fillRect(0, 0, W, H);
    if (!o.mini) {
      c.strokeStyle = "rgba(58,46,32,.2)"; c.lineWidth = .8; c.beginPath();
      for (let y = 3; y < h - 3; y += 2) for (let x = 3; x < w - 3; x += 2) {

      if (img) f += `<p class="dica">O mapa é a sua imagem. Quando trocar por uma versão nova, os lugares marcados continuam no mesmo ponto do mapa.</p>`;
      else {
        if (!S.cands) S.cands = [1, 2, 3].map(() => Math.floor(Math.random() * 1e6));
        f += `<div class="linha">${botoesFerr([["mao", "Mover"], ["pincel", "Pintar terra"], ["borracha", "Pintar mar"]])}${tamanhos()}</div>
        <div class="linha"><span class="dica">Ou comece de um destes e ajuste no pincel:</span><div class="cands">${S.cands.map(sd => `<button type="button" data-cand="${sd}" aria-label="Usar este continente"><canvas class="mini" data-cmini="${sd}"></canvas></button>`).join("")}</div><button type="button" class="mbt" data-acao="cands">Mais três</button></div>`;
      }
    } else if (n === 2) {
      f = img ? `<h2>O relevo</h2><p class="dica">Seu mapa é uma imagem, então o relevo já está nela. Siga para os lugares.</p>`
        : `<h2>Ponha o relevo</h2><div class="linha">${botoesFerr([["mao", "Mover"]])}${swatches([2, 3, 4, 1])}${tamanhos()}</div><p class="dica">Pinte por cima da terra. O campo é a terra lisa.</p>`;
    } else if (n === 3) {
      const l = S.sel && lugar(S.sel);
      f = `<h2>Marque os lugares</h2><div class="linha">${botoesFerr([["mao", "Mover"], ["lugar", "Pôr lugar"]])}<span class="dica">Toque no mapa para pôr. Arraste um lugar para mudar de posição.</span></div>
        ${l ? `<div class="linha" style="align-items:end"><label class="cp" style="min-width:200px"><span>Nome</span><input id="nome-lugar" type="text" value="${esc(l.nome)}" autocomplete="off" maxlength="80"></label><div class="seg" style="min-width:200px"><button type="button" data-tipo="cidade" aria-pressed="${l.tipo === "cidade"}">Cidade</button><button type="button" data-tipo="masmorra" aria-pressed="${l.tipo === "masmorra"}">Masmorra</button></div><button type="button" class="mbt" data-acao="apagar-lugar">Apagar</button></div>` : ""}`;
    } else if (n === 4) {
      if (a.tipo === "planta") f = `<h2>Planta de ${esc(a.lugar.nome)}</h2><div class="linha">${opcoesPlanta(a)}<button type="button" class="mbt" data-acao="voltar-mundo">‹ Escolher outro lugar</button></div>
        ${a.obj.fonte === "imagem" ? `<p class="dica">A planta é uma imagem. Troque quando quiser.</p>` : `<div class="linha">${botoesFerr()}</div><p class="dica">${DICA.planta[S.tool.planta]} Cada quadrado vale 1,5 m.</p>`}`;
      else f = `<h2>Desenhe por dentro dos lugares</h2><p class="dica">Escolha um lugar. A planta é opcional, e pode ser desenhada aqui ou enviada como imagem.</p><div class="linha">${M.lugares.map(l => `<button type="button" class="mbt${M.plantas[l.id] ? "" : " forte"}" data-acao="planta" data-id="${l.id}">${M.plantas[l.id] ? "Abrir" : "Fazer"}: ${esc(l.nome)}</button>`).join("") || `<span class="dica">Volte à etapa 3 e marque um lugar primeiro.</span>`}</div>`;
    } else {
      f = `<h2>Em quais mesas este mundo vale?</h2><div style="display:grid;gap:4px">${caixasMesas()}</div>${S.pronto ? `<div class="pronto"><b style="font:600 18px var(--f-disp)">${esc(M.nome)} está salvo</b><span class="dica">${esc(resumo(M, MESAS))}. Você pode voltar e mudar quando quiser.</span><a class="mbt forte" href="mundos.html" style="justify-self:start">Ver Meus mundos</a></div>` : ""}`;
    }
    r("faixa").innerHTML = f;
    r("rodape").innerHTML = `<button type="button" class="mbt" data-acao="passo-ant" ${n === 1 ? "disabled" : ""}>‹ Voltar</button>${desfBtns()}${n < 5 ? `<button type="button" class="mbt forte" data-acao="passo-prox">Próximo ›</button>` : `<button type="button" class="mbt forte" data-acao="pronto">Pronto</button>`}`;
  },
};
function irPasso(n) { prepPasso(n); atualizar() }
function prepPasso(n) {
  S.passo = Math.min(5, Math.max(1, n)); S.pronto = false; S.ajustes = false;
  if (S.alvo.tipo === "planta" && S.passo !== 4) { S.alvo = { tipo: "mundo" }; if (S.ed) { S.ed.v = null; S.ed.ajustar() } }
  const img = M.fonte === "imagem";
  if (S.passo === 1) { S.tool.mundo = img ? "mao" : "pincel"; S.terreno = 1 }
  if (S.passo === 2) { S.tool.mundo = img ? "mao" : "pincel"; S.terreno = 2 }
  if (S.passo === 3) S.tool.mundo = "lugar";
  if (S.passo >= 4) S.tool.mundo = "mao";
}

/* =================== montagem e eventos =================== */
const SHELL = { passos: PASSOS_UI, livre: LIVRE };
function montar() {
  if (S.ed) { S.ed.fim(); S.ed = null }
  const app = $("#app"); app.innerHTML = SHELL[S.modo].esqueleto();
  const t = app.querySelector("[data-tela]"); if (t) S.ed = new Editor(t, OPTS);
  document.querySelectorAll("[data-modo]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.modo === S.modo)));
  atualizar();
}
function atualizar() {
  if (!M) return;
  for (const t of ["mundo", "planta"]) {   // a ferramenta escolhida tem de existir para o mapa como ele está (imagem não tem pincel)
    if (t === "planta" && alvo().tipo !== "planta") continue;
    const ok = ferrDe(t).map(x => x[0]); if (!ok.includes(S.tool[t])) S.tool[t] = ok.includes("sala") ? "sala" : "mao";
  }
  SHELL[S.modo].partes();
  $("#nm").textContent = M.nome || "Mundo sem nome";
  document.querySelectorAll("canvas[data-cmini]").forEach(cv => {
    const sd = +cv.dataset.cmini; if (!CANDS.has(sd)) CANDS.set(sd, { fonte: "desenho", mapa: novoMapa(sd, true), lugares: [], plantas: {} });
    desenhaMini(cv, CANDS.get(sd));
  });
  if (S.ed) S.ed.pedir();
  verSujo();
}
document.querySelectorAll("[data-modo]").forEach(b => b.onclick = () => {
  if (S.modo === b.dataset.modo) return;
  S.modo = b.dataset.modo; try { localStorage.setItem("sm-mundos-modo", S.modo) } catch (e) { }
  S.ajustes = false; if (S.modo === "passos") { if (S.alvo.tipo === "planta") S.passo = 4; else prepPasso(S.passo) }
  montar();
});
const app = $("#app");
app.addEventListener("click", e => {
  const b = e.target.closest("button,[data-acao]"); if (!b || !app.contains(b) || b.matches("input")) return;
  const d = b.dataset;
  if (d.ferr) { S.tool[alvo().tipo] = d.ferr; if (d.ferr === "pincel" && S.modo === "passos" && S.passo === 1) S.terreno = 1; atualizar(); return }
  if (d.ter !== undefined) { S.terreno = +d.ter; S.tool.mundo = "pincel"; atualizar(); return }
  if (d.raio) { S.raio = +d.raio; atualizar(); return }
  if (d.tipo) { const l = lugar(S.sel); if (l) { marcar({ tipo: "mundo", obj: M }); lugar(S.sel).tipo = d.tipo } atualizar(); return }
  if (d.fonte) { trocarFonte(d.de === "mundo" ? M : alvo().obj, d.fonte); return }
  if (d.passo) { irPasso(+d.passo); return }
  if (d.cand) { gerarDeNovo(+d.cand); if (S.ed) S.ed.ajustar(); return }
  switch (d.acao) {
    case "desfazer": desfazer(); break;
    case "refazer": refazer(); break;
    case "voltar-mundo": voltarMundo(); break;
    case "planta": abrirPlanta(d.id); break;
    case "ajustes": S.ajustes = !S.ajustes; if (S.ajustes) S.sel = null; atualizar(); break;
    case "enviar": pedirImagem(d.de === "mundo" ? M : alvo().obj); break;
    case "apagar-lugar": confirmar(b, "Apagar mesmo?", () => { marcar({ tipo: "mundo", obj: M }); M.lugares = M.lugares.filter(l => l.id !== S.sel); delete M.plantas[S.sel]; S.sel = null; atualizar() }); break;
    case "apagar-planta": confirmar(b, "Apagar a planta?", () => { const id = S.alvo.lugar; voltarMundo(); marcar({ tipo: "mundo", obj: M }); delete M.plantas[id]; atualizar() }); break;
    case "gerar": confirmar(b, "Toque de novo para trocar a terra", () => gerarDeNovo(Math.floor(Math.random() * 1e6))); break;
    case "cands": S.cands = null; atualizar(); break;
    case "passo-ant": irPasso(S.passo - 1); break;
    case "passo-prox": irPasso(S.passo + 1); break;
    case "pronto": S.pronto = true; salvar(); atualizar(); break;
  }
});
app.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.mesa) trocarMesa(t.dataset.mesa, t.checked);
  if (t.dataset.acao === "dedo") { S.dedoMove = t.checked; atualizar() }
});
app.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "nome-lugar") { const l = lugar(S.sel); if (!l) return; l.nome = t.value; const h = app.querySelector(".cartao h3"); if (h) h.textContent = l.nome; S.ed && S.ed.pedir(); verSujo() }
  if (t.id === "nome-mundo") { M.nome = t.value; $("#nm").textContent = M.nome || "Mundo sem nome"; const tr = app.querySelector("[data-r=trilha] b"); if (tr && alvo().tipo === "mundo") tr.textContent = M.nome; verSujo() }
});
addEventListener("keydown", e => {
  if (!M || e.target.matches("input,select,textarea")) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? refazer() : desfazer() }
});
addEventListener("beforeunload", e => { if (M && (pendente() || enviando)) { salvar(); e.preventDefault(); e.returnValue = "" } });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && M && pendente()) salvar() });
$("#bt-voltar").onclick = async e => { e.preventDefault(); if (enviando) { status("Espere a imagem terminar de enviar.", true); return } await salvar(); if (salvando) await salvando; location.href = "mundos.html" };

async function abrirEditor(id) {
  document.body.classList.add("editando"); $("#ed").hidden = false; status("Abrindo…");
  const [w, rows, mesas] = await Promise.all([
    sb.from("mesa_conteudo").select("id,nome,dono_id").eq("id", id).eq("tipo", "mundo").maybeSingle(),
    sb.from("mesa_conteudo").select(COLS).eq("mundo_id", id),
    sb.from("mesas").select("id,nome,mundo_id").eq("mestre_id", EU.id).order("criado_em")]);
  if (w.error || rows.error || !w.data || w.data.dono_id !== EU.id) {
    app.innerHTML = `<p class="msg erro" style="padding:16px">Não achei esse mundo, ou ele não é seu. <a href="mundos.html">Voltar a Meus mundos</a></p>`; status(""); return;
  }
  M = montarMundo(w.data, rows.data); MESAS = mesas.data || [];
  const noBanco = new Set([id, ...rows.data.map(r => r.id)]);
  linhas().forEach(r => { if (noBanco.has(r.id)) SALVO.set(r.id, JSON.stringify(r)) });
  carregaImg(M);
  document.title = (M.nome || "Mundo") + " · Sala de Mesa";
  limparSobras(rows.data);
  prepPasso(1); montar(); if (!pendente()) status("Salvo");
}

/* =================== Meus mundos =================== */
const LIB = {};
async function abrirLib() {
  $("#lib").hidden = false;
  const lm = $("#l-mundos"); lm.textContent = "Carregando…";
  const { data: ws, error } = await sb.from("mesa_conteudo").select("id,nome,dono_id,criado_em").eq("tipo", "mundo").eq("dono_id", EU.id).order("criado_em", { ascending: false });
  if (error) { lm.textContent = ""; const e = $("#lib-erro"); e.textContent = "Não consegui ler os seus mundos agora. Tente de novo."; e.hidden = false; return }
  const ids = ws.map(w => w.id);
  const [rows, mesas] = await Promise.all([
    ids.length ? sb.from("mesa_conteudo").select(COLS).in("mundo_id", ids).in("tipo", ["mapa", "pagina"]) : { data: [] },
    sb.from("mesas").select("id,nome,mundo_id").eq("mestre_id", EU.id)]);
  lm.textContent = "";
  if (!ws.length) { lm.append(smEl("p", { class: "vazio" }, "Você ainda não criou nenhum mundo. Crie o primeiro aqui embaixo.")); return }
  ws.forEach(w => {
    const X = LIB[w.id] = montarMundo(w, rows.data || []); carregaImg(X);
    const cv = smEl("canvas", { "data-mini": w.id, "aria-hidden": "true" });
    const apagar = smEl("button", { class: "mini-bt", type: "button", onclick: ev => smConfirmar(ev.currentTarget, "Toque de novo para apagar", () => apagarMundo(w.id, ev.target)) }, "Apagar");
    lm.append(smEl("div", { class: "mcard" }, smEl("a", { href: "mundos.html?w=" + w.id, "aria-label": "Abrir " + w.nome }, cv),
      smEl("div", {}, smEl("b", {}, w.nome), smEl("small", {}, resumo(X, mesas.data)), smEl("div", { class: "acoes" }, smEl("a", { class: "mini-bt", href: "mundos.html?w=" + w.id }, "Abrir"), apagar))));
    desenhaMini(cv, X);
  });
}
async function apagarMundo(id, bt) {
  bt.disabled = true; bt.textContent = "Apagando…";
  try {
    const pasta = "mundos/" + id;
    for (let i = 0; i < 20; i++) { const arqs = await smListar(pasta); if (!arqs.length) break; const { error } = await sb.storage.from("mesas").remove(arqs.map(f => pasta + "/" + f.name)); if (error) throw error }
    const { error } = await sb.from("mesa_conteudo").delete().eq("id", id); if (error) throw error;
    abrirLib();
  } catch (x) { console.error(x); bt.disabled = false; bt.textContent = "Apagar"; const e = $("#lib-erro"); e.textContent = "Não consegui apagar o mundo. Confira a internet e tente de novo."; e.hidden = false }
}
document.querySelectorAll('input[name="comeco"]').forEach(r => r.onchange = () => { $("#c-img").hidden = document.querySelector('input[name="comeco"]:checked').value !== "imagem" });
$("#f-novo").onsubmit = async e => {
  e.preventDefault();
  const msg = $("#novo-msg"), bt = $("#bt-novo"), nome = $("#in-nome").value.trim(), comeco = document.querySelector('input[name="comeco"]:checked').value, arq = $("#in-img").files[0];
  msg.className = "msg erro";
  if (!nome) { msg.textContent = "Dê um nome para o mundo."; return }
  if (comeco === "imagem" && !arq) { msg.textContent = "Escolha a imagem do mapa."; return }
  bt.disabled = true; msg.className = "msg"; msg.textContent = "Criando…";
  try {
    const id = uid(), mapaId = uid(), seed = Math.floor(Math.random() * 1e6), mapa = novoMapa(seed, comeco === "pronto");
    let r = await sb.from("mesa_conteudo").insert({ id, tipo: "mundo", nome, dono_id: EU.id }); if (r.error) throw r.error;
    const linha = { id: mapaId, tipo: "mapa", nome: "Mapa do mundo", mundo_id: id, dados: { fonte: "desenho", desenho: { w: mapa.w, h: mapa.h, seed, cel: b64(mapa.cel) } } };
    if (comeco === "imagem") {
      msg.textContent = "Enviando a imagem…";
      const corpo = await smReduzir(arq, 3200, 1500 * 1024); let bmp;
      try { bmp = await createImageBitmap(corpo) } catch (x) { throw new Error("formato") }
      const caminho = "mundos/" + id + "/" + smNomeArquivo(arq.name, corpo !== arq ? "jpg" : null);
      const up = await sb.storage.from("mesas").upload(caminho, corpo, { contentType: corpo.type || arq.type }); if (up.error) throw up.error;
      Object.assign(linha, { imagem: caminho, largura: bmp.width, altura: bmp.height }); linha.dados.fonte = "imagem";
    }
    r = await sb.from("mesa_conteudo").insert(linha); if (r.error) throw r.error;
    location.href = "mundos.html?w=" + id;
  } catch (x) {
    console.error(x); bt.disabled = false; msg.className = "msg erro";
    msg.textContent = x.message === "formato" ? "Não consegui ler essa imagem. Use JPG ou PNG." : "Não consegui criar o mundo. Confira a internet e tente de novo.";
  }
};

(async () => {
  EU = (await smExigirLogin()).user;
  if (WID) await abrirEditor(WID); else await abrirLib();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => S.ed && S.ed.pedir());
})().catch(x => { if (x.message !== "sem login") { console.error(x); const e = $("#lib-erro"); e.textContent = "Algo deu errado ao abrir. Tente de novo."; e.hidden = false; $("#lib").hidden = false } });
</script>
